  .dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4da6ff;
    animation: pulse 1.2s ease-in-out infinite;
  }

  .dots span:nth-child(2) {
    animation-delay: 0.2s;
  }

  .dots span:nth-child(3) {
    animation-delay: 0.4s;
  }

  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; }
    40% { opacity: 1; }
  }
